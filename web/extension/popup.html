<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ω∞v VaaS</title>
  <style>
    body {
      width: 320px;
      font-family: system-ui, sans-serif;
      background: #090d16;
      color: #f8fafc;
      padding: 1rem;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #38bdf8;
      font-size: 1.1rem;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      padding: 0.5rem;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    button {
      width: 100%;
      padding: 0.6rem;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    pre {
      background: #000;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 0.5rem;
      font-size: 0.75rem;
      color: #38bdf8;
      overflow-x: auto;
      max-height: 180px;
    }
  </style>
</head>
<body>
  <h3>💧 Ω∞v VaaS Verification</h3>
  <label for="intent">Declared Intent</label>
  <textarea id="intent" rows="2">Verify page transaction</textarea>
  
  <label for="evidence">Evidence Log / Hash</label>
  <textarea id="evidence" rows="2">browser active session</textarea>
  
  <button id="verify-btn">Verify & Issue Proof</button>
  
  <h4>Result & Proof Token</h4>
  <pre id="result">Awaiting input...</pre>

  <script src="popup.js"></script>
</body>
</html>
