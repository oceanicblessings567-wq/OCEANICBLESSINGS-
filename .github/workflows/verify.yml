name: Ω∞v System Verification & Continuity Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Ω∞v Pipeline & Continuity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Ω∞v Unit & Integration Tests
        run: |
          python -m unittest discover -s tests

      - name: Run Ω∞v Continuity Pack Audit
        run: |
          python cli.py --continuity
